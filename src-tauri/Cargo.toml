[package]
name = "ferry"
version = "1.6.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
regex = "1"
walkdir = "2"
tauri-plugin-dialog = "2"

# Cursor keeps its conversations in a SQLite file rather than in transcripts, so
# reading them means speaking SQLite. Bundled, because neither Windows nor macOS
# should depend on a system libsqlite3 being installed. About 1 MB.
rusqlite = { version = "0.32", features = ["bundled"] }

# Nearby: send a chat to another Ferry on the same network. mDNS finds the other
# machine; the transfer is an X25519 key exchange and ChaCha20-Poly1305, with a
# code both screens show so a third device on the Wi-Fi can't sit in between.
# All pure Rust. Off until the person turns it on.
mdns-sd = "0.21"
if-addrs = "0.15"
x25519-dalek = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
