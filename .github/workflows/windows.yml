name: Windows build

# Manual only — macOS is the supported target; this exists to produce a test build.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Copy-Item src-tauri/target/release/ferry.exe dist-win/Ferry.exe
          Get-Item dist-win/Ferry.exe | Select-Object Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: Ferry-windows-x64
          path: dist-win/Ferry.exe
          if-no-files-found: error
